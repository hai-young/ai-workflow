spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  datasource:
    url: jdbc:mysql://localhost:3306/workflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    openai:
      api-key: sk-de1f3f3c620d4a3684d2fa0e12f3374a
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.6-plus
      embedding:
        options:
          model: text-embedding-v3   # 阿里云 embedding 模型
          dimensions: 1024           # 根据 curl 测试的结果填写实际维度（阿里云 text-embedding-v3 通常支持 1024）
    vectorstore:
      milvus:
        host: 127.0.0.1
        port: 19530
        database-name: default
        collection-name: workflow_vector_store
        embedding-dimension: 1024    # 必须与 embedding 模型输出维度一致
        embedding-field-name: vector  # 🎯 核心配置: 指定集合中的向量字段名
        initialize-schema: true  # 开启 Schema 自动初始化
logging:
  level:
    com.zhy: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.cors: DEBUG
jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation-must-be-long-enough
  expiration: 86400000  # 24 hours in milliseconds

# ── Elasticsearch 配置 ──
elasticsearch:
  enabled: true
  host: localhost
  port: 9200
  # username: elastic    # 如需认证取消注释
  # password: changeme

# ── RAG 对话记忆配置 ──
rag:
  memory:
    max-rounds: 10        # 触发摘要压缩的轮数阈值
    ttl-seconds: 86400    # 记忆过期时间（24h）

# ── BGE-Reranker 配置 ──
reranker:
  url: http://localhost:6006/v1/rerank
  timeout-ms: 2000

# ── MinIO 配置（复用 milvus-minio 实例，新建独立 bucket） ──
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-documents: rag-documents
  bucket-chunks: rag-chunks

