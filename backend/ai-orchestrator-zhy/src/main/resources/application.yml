spring:
  datasource:
    url: jdbc:mysql://localhost:3306/workflow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
  ai:
    openai:
      api-key: sk-de1f3f3c620d4a3684d2fa0e12f3374a
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.6-plus
      embedding:
        options:
          model: text-embedding-v3   # 阿里云 embedding 模型
          dimensions: 1024           # 根据 curl 测试的结果填写实际维度（阿里云 text-embedding-v3 通常支持 1024）
    vectorstore:
      milvus:
        host: localhost
        port: 19530
        database-name: default
        collection-name: workflow_vector_store
        embedding-dimension: 1024    # 必须与 embedding 模型输出维度一致
        embedding-field-name: vector  # 🎯 核心配置: 指定集合中的向量字段名
        initialize-schema: true  # 开启 Schema 自动初始化
logging:
  level:
    com.zhy: DEBUG
jwt:
  secret: your-256-bit-secret-key-for-jwt-token-generation-must-be-long-enough
  expiration: 86400000  # 24 hours in milliseconds