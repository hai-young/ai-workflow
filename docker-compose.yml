services:
  mysql:
    image: mysql:8.0
    container_name: ai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: workflow_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ai-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    container_name: milvus-minio
    # 修正：使用正确的标签
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  elasticsearch:
    # 1. 使用官方镜像，建议使用具体版本号
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: ai-elasticsearch
    environment:
      # 关键配置：单节点模式运行，用于开发或测试
      - discovery.type=single-node
      # 限制JVM堆内存，避免内存占用过高，这里设为512MB
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      # 可选：关闭生产环境的安全认证，简化连接；生产环境建议开启
      - xpack.security.enabled=false
      # 可选：设置时区
      - TZ=Asia/Shanghai
    ports:
      # 宿主机端口:容器端口，其他应用通过此端口访问ES
      - "9200:9200"
      # 集群内部通信端口，单机模式下可以按需暴露
      - "9300:9300"
    volumes:
      # 【重要】挂载数据卷，实现数据持久化
      - es_data:/usr/share/elasticsearch/data
    # 可选：限制容器整体内存使用上限
    # mem_limit: 1g
    restart: unless-stopped
    # 可选：添加健康检查，自动监测服务状态
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 5
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: ai-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN   # 中文界面
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

  reranker:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/bge-rerank-v2-m3:v0.1
    ports:
      - "6006:6006"
    environment:
      - ACCESS_TOKEN=your-secret-token # 建议设置认证令牌

  attu:
    image: zilliz/attu:latest
    container_name: ai-attu
    ports:
      - "3000:3000"
    environment:
      - MILVUS_URL=standalone:19530   # 关键：使用 compose 中的服务名
    depends_on:
      - standalone
    restart: unless-stopped

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  es_data:  # 新增，用于Elasticsearch数据持久化